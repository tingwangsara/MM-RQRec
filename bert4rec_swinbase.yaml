model: MOBERT4Rec

#visual encoder
seed: 2020
encoder_name: 'swin-base-patch4-window7-224'
encoder_source: 'transformers'

#text encoder 
use_text_online: True #是否启用txt
text_model_name: 'chinese_bert_wwm'     # bert_base_uncased, chinese_bert_wwm                
image_weight: 0.5
text_weight: 0.5
text_max_len: 30 #文本最大长度



use_modality: True
checkpoint_dir: Saved/MOBERT4Rec
MAX_ITEM_LIST_LENGTH: 20 #

n_layers: 2
n_heads: 4
embedding_size: 1024 #
inner_size: 1
hidden_dropout_prob: 0.1
attn_dropout_prob: 0.1
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
mask_ratio: 0.6

num_workers: 4 #

data_path: ../../../data
dataset: QB
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id

image_path: ../../../data/QB/QB.lmdb  # load lmdb database

behaviors: 'QB_behaviour.tsv'  # run get_behaviour to get behaviour.tsv
texts: 'QB_item.csv'

fine_tune_arg: {
    tune_scale: 0, 
    pre_trained: True,
    activation: 'relu',
    dnn_layers: [],
    method: 'pool'                        
}


metric_decimal_place: 7
leave_num_list: [1,1]

# Training and evaluation config
epochs: 220 #

train_batch_size: 32  #
eval_batch_size: 1280 #

neg_sampling_num: 1
neg_sampling: {'uniform' : 1}



optim_args: {
    learner: AdamW,
    modal_lr: 0.0001,
    rec_lr: 0.0001,
    modal_decay: 0.1,
    rec_decay: 0.1
}


eval_step: 1 # 
stopping_step: 20


topk: [10]
metrics: ['Recall', 'NDCG', 'Precision']
valid_metric: NDCG@10

modal_fusion: "fused"   # 可选: "img" / "txt" / "fused"

quantizer_type: vqvae
use_rqvae: False
use_vqvae: True

vqvae_codebook_size: 128
vqvae_commitment_weight: 0.25
quantizer_loss_weight: 0.01

rqvae_num_codebooks: 2
rqvae_codebook_size: 128
rqvae_loss_weight: 0.001

freeze_lora_after_epoch: 9